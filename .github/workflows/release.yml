name: Release Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false


env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      image_name: ${{ steps.format-name.outputs.image_name }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lowercase Repository Name
        id: format-name
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ github.repository }}"
          echo "image_name=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.format-name.outputs.image_name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Azure Web App
    needs: build-and-push
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check for Azure Publish Profile Secret
        id: check-secret
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          if [ -z "$PUBLISH_PROFILE" ]; then
            echo "has_secret=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Deployment Pending Secret::AZURE_WEBAPP_PUBLISH_PROFILE secret is not set yet. Configure this secret in GitHub repo settings (Settings > Secrets and variables > Actions) to complete deployment."
          else
            echo "has_secret=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Container to Azure Web App
        if: steps.check-secret.outputs.has_secret == 'true'
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME || 'cicd-fastapi-app' }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ needs.build-and-push.outputs.image_name }}:latest
